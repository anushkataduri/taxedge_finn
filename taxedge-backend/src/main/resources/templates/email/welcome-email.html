<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; background:#f5f6f8; padding:24px;">

  <div style="max-width:560px; margin:auto; background:#ffffff; border-radius:8px; padding:32px;">

    <h2 style="color:#0F2A4A; margin-top:0;">Welcome to TaxEdge</h2>

    <p style="color:#1F2933; font-size:15px;">
      Hello <span th:text="${name}">Customer</span>,
    </p>

    <p style="color:#1F2933; font-size:15px;">
      Your TaxEdge account is ready. You can now file returns, track refunds
      and talk to a CA from the app.
    </p>

    <p style="color:#5B6B7C; font-size:14px;">
      Your customer ID: <strong th:text="${custId}">CI7K3QX9MB</strong>
    </p>

    <p style="color:#5B6B7C; font-size:13px; margin-top:32px;">
      If you did not create this account, please contact support.
    </p>

  </div>

</body>
</html>
