spring:
  application:
    name: taxedge-backend

  profiles:
    active: dev

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:taxedge.notifications@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            protocols: TLSv1.2 TLSv1.3
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    from: ${MAIL_FROM:taxedge.notifications@gmail.com}
    from-name: ${MAIL_FROM_NAME:TaxEdge}


server:
  port: ${PORT:8086}

  error:
    include-message: always


jwt:
  secret: 7fK9mQ2xV8pL4zR6tY13sH8jA0eB6uI9oP2vX4kG7nM5qZ1rT8
  expiration: 3600000    # 3 minutes for testing


# ===============================
# ACTUATOR
# ===============================

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always
      show-components: always

    prometheus:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}


logging:
  level:
    com.taxedge: DEBUG